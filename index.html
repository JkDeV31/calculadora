<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora JavaScript | JkDeV</title>
    <meta name="description" content="Projeto educacional de calculadora em HTML, CSS e JavaScript, com operações matemáticas, tratamento de erros e layout responsivo.">
    <link rel="canonical" href="https://jkdev31.github.io/calculadora/">

    <!-- Prévia de compartilhamento para redes sociais -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="JkDeV">
    <meta property="og:title" content="Calculadora JavaScript — Projeto educacional | JkDeV">
    <meta property="og:description" content="Calculadora desenvolvida com HTML, CSS e JavaScript para praticar lógica, operações matemáticas, interatividade e tratamento de erros.">
    <meta property="og:url" content="https://jkdev31.github.io/calculadora/">
    <meta property="og:image" content="https://jkdev31.github.io/calculadora/img/preview-social.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Prévia da Calculadora JavaScript, com interface real do projeto educacional de JkDeV">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/scripts.js" defer></script>
</head>
<body>
    <div id="calc">
        <h3>Calculadora</h3>
        <div id="operations">
            <div id="previous-operation"></div>
            <div id="current-operation"></div> 
        </div>
        <div id="buttons-container">
            <button>CE</button>
            <button>C</button>
            <button>DEL</button>
            <button>/</button>
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button>*</button>
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button>-</button>
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button>+</button>
            <button class="number">0</button>
            <button class="number">.</button>
            <button id="equal-btn">=</button>
        </div>
    </div>
</body>
</html>
